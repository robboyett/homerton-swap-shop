<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff}
a{color:#262626;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:4px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-underline-offset:4px}
</style>
</helmet>
<div style="box-sizing: border-box; width: 390px; height: 844px; overflow-y: auto; padding: 24px 20px 48px; background: #ffffff; color: #262626; font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; line-height: 18px">

<header style="display: flex; justify-content: space-between; align-items: baseline">
<a href="Browse-phone.dc.html">homerton swap shop</a>
<a href="Scan.dc.html" style="padding: 12px 0 12px 16px">add books</a>
</header>

<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-top: 24px">
<span>age</span>
<sc-for list="{{ages}}" as="a" hint-placeholder-count="5">
<button type="button" onClick="{{a.pick}}" aria-pressed="{{a.pressed}}" style="padding: 10px 0; text-decoration: {{a.deco}}">{{a.label}}</button>
</sc-for>
</div>

<main style="display: flex; flex-direction: column; gap: 40px; margin-top: 32px">
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="6">
<section style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 16px">
<span>{{sec.name}}</span>
<span>{{sec.count}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{sec.books}}" as="b" hint-placeholder-count="6">
<a href="Book.dc.html" aria-label="book, ages {{b.age}}" style="display: block; position: relative; aspect-ratio: 2 / 3; overflow: hidden; border-radius: 2px; background: {{b.bg}}; opacity: {{b.op}}; box-shadow: 0 1px 1px rgba(0,0,0,0.08), 0 3px 8px rgba(0,0,0,0.10)">
<div style="position: absolute; {{b.s1}}"></div>
<div style="position: absolute; {{b.s2}}"></div>
<div style="position: absolute; left: 0; top: 0; width: 5%; height: 100%; background: rgba(0,0,0,0.14)"></div>
</a>
</sc-for>
</div>
</section>
</sc-for>
</main>

<footer style="display: flex; flex-direction: column; gap: 4px; margin-top: 56px">
<a href="How-it-works-phone.dc.html" style="padding: 8px 0">how it works</a>
<span>invite only</span>
<span>homerton</span>
<span>everything here is free</span>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const age = (this.state && this.state.age) || 'all';
    const SHELVES = [
      ['picture books', [
        'e9c46a,264653,0,0-3', 'f4a261,2a9d8f,1,0-3', 'a8dadc,1d3557,2,0-3', 'ffb703,fb8500,4,0-3',
        'cdb4db,4a3b6b,0,4-6', 'b7e4c7,1b4332,5,4-6', 'ffafcc,7b2d4f,2,4-6,r', '8ecae6,023047,3,4-6',
        'f28482,f6bd60,1,4-6', '84a59d,f5cac3,4,0-3', 'fefae0,bc6c25,5,4-6', 'dda15e,283618,0,4-6'
      ]],
      ['early readers', [
        '606c38,fefae0,1,4-6', 'e76f51,f6e7c8,3,4-6', 'bde0fe,2a4d8f,4,4-6', 'ffd166,073b4c,2,4-6',
        '06d6a0,073b4c,5,7-9', 'ef476f,ffd166,0,7-9', '118ab2,ffd166,1,7-9', 'f4a261,264653,4,4-6'
      ]],
      ['chapter books', [
        '0b132b,f4d35e,5,7-9', '22223b,f2e9e4,2,7-9', '9a8c98,f2e9e4,0,7-9', 'e9c46a,264653,3,7-9',
        '2a9d8f,e9f5db,4,7-9', 'bc4749,f2e8cf,1,7-9', '386641,f2e8cf,5,7-9', 'ffb4a2,6d6875,2,7-9,r',
        '6d597a,eaac8b,0,7-9', '3a5a40,dad7cd,3,7-9'
      ]],
      ['fantasy and adventure', [
        '1d3557,ffd166,5,7-9', '3c096c,ff9e00,2,10+', '14213d,fca311,0,10+', '5f0f40,fb8b24,4,10+',
        '0f4c5c,e36414,1,7-9,r', '2b2d42,edf2f4,3,10+', '540b0e,e09f3e,5,10+', '335c67,fff3b0,2,7-9',
        '7209b7,f72585,0,10+'
      ]],
      ['science and nature', [
        'a7c957,386641,3,7-9', '219ebc,023047,0,7-9', 'ffb703,023047,4,4-6', '8ecae6,219ebc,1,4-6',
        'ccd5ae,606c38,5,7-9', 'e9edc9,bc6c25,2,10+'
      ]],
      ['young adult', [
        '212529,e9ecef,2,10+', '6a040f,faa307,0,10+', '03071e,ffba08,5,10+', '370617,f48c06,3,10+',
        'cdb4db,22223b,1,10+'
      ]]
    ];
    const V = [
      (fg) => ({ s1: 'left:20%;top:28%;width:60%;height:40%;border-radius:50%;background:' + fg + ';', s2: 'left:0;top:80%;width:100%;height:20%;background:rgba(0,0,0,0.16);' }),
      (fg) => ({ s1: 'left:0;top:38%;width:100%;height:24%;background:' + fg + ';', s2: 'left:62%;top:12%;width:22%;height:14.67%;border-radius:50%;background:rgba(255,255,255,0.55);' }),
      (fg) => ({ s1: 'left:14%;top:46%;width:72%;height:48%;border-radius:50% 50% 0 0;background:' + fg + ';', s2: 'left:14%;top:10%;width:30%;height:20%;border-radius:50%;background:rgba(255,255,255,0.5);' }),
      (fg) => ({ s1: 'left:18%;top:20%;width:30%;height:62%;background:' + fg + ';', s2: 'left:52%;top:42%;width:30%;height:40%;background:rgba(255,255,255,0.45);' }),
      (fg) => ({ s1: 'left:30%;top:10%;width:40%;height:26.67%;border-radius:50%;background:' + fg + ';', s2: 'left:-20%;top:62%;width:140%;height:60%;border-radius:50% 50% 0 0;background:rgba(0,0,0,0.2);' }),
      (fg) => ({ s1: 'left:0;top:0;width:100%;height:100%;background:' + fg + ';clip-path:polygon(0 100%,100% 45%,100% 100%);', s2: 'left:60%;top:10%;width:26%;height:17.33%;border-radius:50%;background:rgba(255,255,255,0.6);' })
    ];
    const sections = [];
    SHELVES.forEach((shelf) => {
      const books = shelf[1]
        .map((r) => r.split(','))
        .filter((p) => age === 'all' || p[3] === age)
        .map((p) => {
          const v = V[Number(p[2])]('#' + p[1]);
          return { bg: '#' + p[0], s1: v.s1, s2: v.s2, age: p[3], op: p[4] === 'r' ? 0.35 : 1 };
        });
      if (books.length) {
        sections.push({ name: shelf[0], count: books.length, books: books });
      }
    });
    const ages = ['all', '0-3', '4-6', '7-9', '10+'].map((a) => ({
      label: a,
      deco: a === age ? 'underline' : 'none',
      pressed: a === age,
      pick: () => this.setState({ age: a })
    }));
    return { ages: ages, sections: sections };
  }
}
</script>
</body>
</html>
